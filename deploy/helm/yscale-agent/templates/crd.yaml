{{- /* installCRD lets a SECOND agent release on the same cluster skip the
       cluster-scoped Workload CRD (only one helm release may own it). Default
       true = normal single install. Set installCRD=false for the additional
       release (e.g. a 2nd team/tenant agent). */}}
{{- if .Values.installCRD }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloads.yscale.sh
  labels:
    {{- include "yscale-agent.labels" . | nindent 4 }}
spec:
  group: yscale.sh
  names:
    kind: Workload
    listKind: WorkloadList
    plural: workloads
    singular: workload
    shortNames:
      - wl
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Reason
          type: string
          jsonPath: .status.reason
          priority: 1
        - name: Backend
          type: string
          jsonPath: .status.backend
        - name: Region
          type: string
          jsonPath: .status.region
          priority: 1
        - name: GPU
          type: string
          jsonPath: .status.gpu.kind
        - name: GPUs
          type: integer
          jsonPath: .status.gpu.count
          priority: 1
        - name: Burst
          type: string
          jsonPath: .status.burstID
        - name: Pod
          type: string
          jsonPath: .status.podName
          priority: 1
        - name: Node
          type: string
          jsonPath: .status.nodeName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Cost
          type: string
          jsonPath: .status.costSoFarUSD
        - name: FinalCost
          type: string
          jsonPath: .status.finalCostUSD
          priority: 1
        - name: SKU
          type: string
          jsonPath: .status.sku
          priority: 1
        - name: Outcome
          type: string
          jsonPath: .status.outcome
          priority: 1
        - name: Finished
          type: string
          jsonPath: .status.finishedAt
          priority: 1
        - name: Cleanup
          type: string
          jsonPath: .status.cleanupState
          priority: 1
      schema:
        # Mostly loose schema: pkg/workload.Validate enforces the real rules
        # server-side. The networking tier is the exception so Kubernetes
        # itself cannot persist a new CR selecting the removed lite tier.
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                networking:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    tier:
                      type: string
                      enum:
                        - ""
                        - full
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                # Live GPU telemetry projected from central. The agent writes
                # the pair atomically only when central emitted a validated
                # observation, so the CRD constrains utilisation to [0, 100]
                # and pins lastHeartbeatAt as an RFC3339 timestamp.
                gpuUtilPercent:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 100
                lastHeartbeatAt:
                  type: string
                  format: date-time
                providerCreatedAt:
                  type: string
                  format: date-time
                gpu:
                  type: object
                  properties:
                    product:
                      type: string
                # Additive receipt fields: the agent projects central's
                # existing outcome payload onto distinct compute and
                # artifact legs, without disturbing the legacy status.outcome
                # string. Count fields are non-negative int64s and stay
                # omitted (nil-vs-zero preserved) unless central actually
                # counted them.
                computeResult:
                  type: string
                computeReason:
                  type: string
                artifactResult:
                  type: string
                artifactReason:
                  type: string
                artifactObjectsUploaded:
                  type: integer
                  format: int64
                  minimum: 0
                artifactBytesUploaded:
                  type: integer
                  format: int64
                  minimum: 0
{{- end }}
