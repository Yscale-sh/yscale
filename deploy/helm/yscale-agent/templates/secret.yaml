{{- if and .Values.token (not .Values.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-yscale-agent-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yscale-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  YSCALE_TOKEN: {{ .Values.token | quote }}
  # TS_AUTHKEY is the ephemeral Tailscale auth key for joining yscale's
  # tailnet. Mint it via the Tailscale admin console (or API) with:
  #   - reusable: true (one Helm install -> one Secret -> one key)
  #   - ephemeral: true (device cleaned up automatically on disconnect)
  #   - tags: ["tag:yscale-agent"]
  # For production, prefer existingSecret over inline `token` so the
  # auth key never appears in `helm get values` output.
  TS_AUTHKEY: {{ .Values.tsAuthKey | default "" | quote }}
{{- end -}}
