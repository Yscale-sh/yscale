apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything lands in the homelab monitoring namespace (kube-prometheus-stack).
namespace: monitoring

resources:
  - yscale-cost-servicemonitor.yaml
  - yscale-reliability-alerts.yaml

# The Grafana dashboard sidecar loads any ConfigMap labelled
# grafana_dashboard: "1" in the monitoring namespace.
configMapGenerator:
  - name: grafana-dashboard-yscale-cost
    files:
      - yscale-cost-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true
