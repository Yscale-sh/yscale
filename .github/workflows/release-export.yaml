name: full-source export

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  privacy-and-completeness:
    # The export needs website/ inline; the private monorepo carries it as a
    # private submodule this job cannot check out, so only the public repo runs it.
    if: github.repository == 'Yscale-sh/yscale'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export reviewed full source
        run: |
          set -euo pipefail
          go test ./scripts/release-export ./test/release
          go run ./scripts/release-export -output "$RUNNER_TEMP/public-source"
      - name: Install pinned secret scanner
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$scanner_dir/archive.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$scanner_dir/archive.tar.gz" | sha256sum -c -
          tar -xzf "$scanner_dir/archive.tar.gz" -C "$scanner_dir" gitleaks
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan exported source without private-history allowlist
        run: gitleaks dir "$RUNNER_TEMP/public-source" --redact --no-banner
      - name: Build and test the export itself
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/public-source"
          go build ./...
          go test ./scripts/release-export ./test/release ./internal/launch
          cd website
          npm ci
          npm test
          npm run build
          go -C server test ./...
