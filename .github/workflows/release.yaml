name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    uses: ./.github/workflows/release-export.yaml
  version:
    name: version pins match the tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Chart, manifests and quickstart name this release
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
  images:
    needs: [preflight, version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
  build:
    needs: [preflight, version]
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Require approved license and reviewed full source
        run: go run ./scripts/release-export -publication

      - name: Package full self-hosted managed-mesh stack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          bash scripts/package-release.sh "$GITHUB_REF_NAME" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yscale-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [build, images]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yscale-*
          path: dist
          merge-multiple: true

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true

      # The digests the chart and manifests should be pinned to in production
      # (agent.image.digest with requireDigest), published beside the bundles.
      - name: Write images.txt
        run: |
          sort digests/*.txt > dist/images.txt
          cat dist/images.txt
          [ "$(wc -l < dist/images.txt)" -eq 3 ]

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/images.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
