name: agent-image
on:
  push:
    branches:
      - main
    paths:
      - 'burst/**'
      - 'go.mod'
      - 'go.sum'
      - 'pkg/**'
      - '.github/workflows/agent-image.yaml'
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: build ${{ matrix.variant }}
    runs-on: [self-hosted, yscale-repo]
    strategy:
      fail-fast: false
      # Dropped legs (2026-07-03), both red for weeks:
      #   - wg: burst/image/Dockerfile.wg was deleted from the tree (last at
      #     29b2121); no code/manifests/cluster reference the image. Restore
      #     the Dockerfile from history before re-adding.
      #   - kubelet: FROM registry.fly.io/yscale-burst-base needs Fly registry
      #     auth and this repo has no FLY_API_TOKEN secret — the base is a
      #     manual "push once" flow (docs/internals/burst-image-and-boot.md).
      #     Re-add with a docker/login-action for registry.fly.io once a token
      #     secret exists.
      matrix:
        include:
          - variant: k3s
            dockerfile: burst/image/Dockerfile
            context: burst/image
            prefix: k3s
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jakenesler/yscale-agent
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.prefix }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.prefix }}-,format=short
            type=semver,pattern={{version}},prefix=${{ matrix.prefix }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.prefix }}-
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-${{ matrix.variant }}
          cache-to: type=gha,scope=agent-${{ matrix.variant }},mode=max
    if: github.event.repository.private && vars.ENABLE_LEGACY_WORKFLOWS == 'true'
