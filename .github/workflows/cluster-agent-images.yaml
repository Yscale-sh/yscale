name: cluster-agent-images
# Builds yscale-cluster-agent: the WS client that runs inside the customer's
# cluster (replaces what `yscale agent` did).
#
# yscale-wg-ingress (the WireGuard endpoint sidecar) was dropped 2026-07-03:
# agent/build/Dockerfile.wg-ingress was deleted from the tree (last at 29b2121)
# and nothing references the image — restore from history to re-add.
#
# Note: ghcr.io/jakenesler/yscale-agent (this org) is the *burst-node*
# image, owned by .github/workflows/agent-image.yaml. Different concern.
on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'agent/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cluster-agent-images.yaml'
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: [self-hosted, yscale-repo]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yscale-cluster-agent
            dockerfile: agent/build/Dockerfile.agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Dockerfile.agent COPYs this prebuilt binary — same recipe as the
      # Makefile's bin/yscale-agent-linux-amd64 target. The workflow used to
      # skip this and every build died on "not found".
      - name: Build agent binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" \
            -o bin/yscale-agent-linux-amd64 \
            ./agent/cmd/yscale-agent
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jakenesler/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 only: the image embeds the prebuilt amd64 binary above (an
          # arm64 leg would ship a foreign binary), matching the Makefile flow.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Record immutable image reference
        run: |
          mkdir -p image-ref
          printf '{"repository":"%s","digest":"%s","source":"%s","reference":"%s@%s"}\n' \
            "ghcr.io/jakenesler/${{ matrix.image }}" \
            "${{ steps.build.outputs.digest }}" \
            "${{ github.sha }}" \
            "ghcr.io/jakenesler/${{ matrix.image }}" \
            "${{ steps.build.outputs.digest }}" \
            > "image-ref/${{ matrix.image }}.json"
          # Literal Markdown backticks, not shell command substitution.
          # shellcheck disable=SC2016
          printf '### Immutable image\n`%s@%s`\n' \
            "ghcr.io/jakenesler/${{ matrix.image }}" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable image reference (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: image-ref-${{ matrix.image }}-${{ github.sha }}
          path: image-ref/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30
    if: github.event.repository.private && vars.ENABLE_LEGACY_WORKFLOWS == 'true'
