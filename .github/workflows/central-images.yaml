name: central-images
on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'central/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/central-images.yaml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: [self-hosted, yscale-repo]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yscale-cloud
            repository: ghcr.io/jakenesler/yscale-cloud
            dockerfile: central/build/Dockerfile.cloud.buildkit
          - name: yscale-hosted-controller
            repository: ghcr.io/jakenesler/yscale-hosted-controller
            dockerfile: central/build/Dockerfile.hosted-controller.buildkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Derive source tag
        id: source
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.repository }}
          tags: |
            type=raw,value=${{ steps.source.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Record immutable image reference
        run: |
          mkdir -p image-ref
          printf '{"repository":"%s","digest":"%s","source":"%s","reference":"%s@%s"}\n' \
            "${{ matrix.repository }}" \
            "${{ steps.build.outputs.digest }}" \
            "${{ github.sha }}" \
            "${{ matrix.repository }}" \
            "${{ steps.build.outputs.digest }}" \
            > "image-ref/${{ matrix.name }}.json"
          # Literal Markdown backticks, not shell command substitution.
          # shellcheck disable=SC2016
          printf '### Immutable image\n`%s@%s`\n' \
            "${{ matrix.repository }}" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable image reference (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: image-ref-${{ matrix.name }}-${{ github.sha }}
          path: image-ref/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30
    if: github.event.repository.private && vars.ENABLE_LEGACY_WORKFLOWS == 'true'
