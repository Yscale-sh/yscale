name: website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yaml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yaml'

permissions:
  contents: read

jobs:
  test:
    name: website / test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test website
        run: npm test

      - name: Build website and release documentation
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: website/server/go.mod
          cache-dependency-path: website/server/go.sum

      - name: Test website server
        working-directory: website/server
        run: go test ./...
