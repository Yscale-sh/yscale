version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /
      - /website/server
      # website/content/release/go.mod is a generated download, not a module
      # to tidy independently. Keep it in sync when reviewing root updates.
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      react:
        patterns: [react, react-dom]
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /agent/build
      - /burst/image
      - /central/build
      - /factory/build
      - /kube-bench
      - /website
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    # Stay on the selected Node LTS major; review future LTS moves explicitly.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      base-images:
        patterns: ["*"]
        group-by: dependency-name
