version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /
      - /website/server
      # The downloadable module manifest mirrors the root module.
      - /website/content/release
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /agent/build
      - /burst/image
      - /central/build
      - /factory/build
      - /kube-bench
      - /website
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
        group-by: dependency-name
